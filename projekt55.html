<!doctype html><html lang="cs"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Projekt 55</title><style>body{font:16px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf4f8;color:#633a53;max-width:480px;margin:24px auto;padding:16px}header{text-align:center;background:#eedce8;border-radius:24px;padding:24px}h1{margin:5px}progress{width:100%;accent-color:#a35a83}section{display:flex;align-items:center;gap:8px;padding:12px 0;border-bottom:1px solid #e6d5e0}section div{flex:1}small{display:block;color:#846879}button{font-size:23px;width:48px;height:48px;border:1px solid #d9c0d0;border-radius:12px;background:white;color:#a35a83}button.on{background:#a35a83;color:white}footer{text-align:center;padding:20px}#warning{font-size:13px}</style><header><small>MOJE VÝZVA · 12 TÝDNŮ</small><h1>PROJEKT 55 ❤️</h1>Silná a zdravá ve 43<h2 id="count">0 / 36</h2><progress id="bar" max="36" value="0"></progress><p id="stats"></p></header><main id="weeks"></main><footer>Ne dokonalost, ale pravidelnost. ❤️<p id="warning"></p></footer><script>let key='projekt55-2026',done={};try{done=JSON.parse(localStorage.getItem(key)||'{}')}catch(e){document.querySelector('#warning').textContent='Tento prohlížeč nemusí ukládat pokrok.'}function render(){let root=document.querySelector('#weeks');root.innerHTML='';let total=0,full=0;for(let i=0;i<12;i++){let a=new Date(2026,10,16+i*7),b=new Date(2026,10,22+i*7),s=document.createElement('section');s.innerHTML='<div><b>'+(i+1)+'. týden</b><small>'+a.toLocaleDateString('cs-CZ',{day:'numeric',month:'numeric'})+' – '+b.toLocaleDateString('cs-CZ',{day:'numeric',month:'numeric'})+'</small></div>';let n=0;for(let j=0;j<3;j++){let k=i+'-'+j,btn=document.createElement('button');if(done[k]){n++;total++;btn.className='on'}btn.textContent=done[k]?'✓':'○';btn.setAttribute('aria-label','Trénink '+(j+1));btn.setAttribute('aria-pressed',!!done[k]);btn.onclick=()=>{done[k]=!done[k];try{localStorage.setItem(key,JSON.stringify(done))}catch(e){document.querySelector('#warning').textContent='Pokrok nelze trvale uložit.'}render()};s.append(btn)}if(n===3)full++;root.append(s)}document.querySelector('#count').textContent=total+' / 36 tréninků';document.querySelector('#bar').value=total;document.querySelector('#stats').textContent=total*15+' minut · '+full+'/12 splněných týdnů'}render()</script></html>
